server {
    listen 80;
    listen [::]:80;
    server_name zt.shentongapi.cn;
    client_max_body_size 1024m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/visideep-manju-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
