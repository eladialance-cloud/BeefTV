server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 308 /admin/;
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        return 404;
    }
}
