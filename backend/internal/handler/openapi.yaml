openapi: 3.0.3
info:
  title: BeefTV HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: admin
  - name: beefapi
  - name: agent-ops
  - name: assistant
  - name: creation-conversations
  - name: manju
paths:
  /manju/projects:
    get:
      tags: [manju]
      summary: 列出当前登录用户可访问的漫剧项目
      description: 只返回 type=manju 的项目；主理人来自项目归属，协作者来自活动成员记录。
      responses:
        "200":
          description: 信封 data.items 为项目摘要，含 accessRole 与 revision
        "401":
          description: 未登录
  /manju/projects/{projectId}:
    get:
      tags: [manju]
      summary: 读取漫剧项目详情
      description: 返回项目、当前访问角色、主理人可见的成员、当前 P0 回执和项目级三槽位模型路由。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.item 为项目详情
        "404":
          description: 项目不存在、不是漫剧项目或当前账号无权访问
  /manju/projects/{projectId}/lock:
    put:
      tags: [manju]
      summary: 保存 P0 立项锁并创建新 revision
      description: |
        仅主理人或制片可写。旧 revision 保留并标记 superseded。
        所有硬锁必须有对应 confirmedLocks 项；有值但未确认不构成选择。
        目标时长超过单段上限时还必须显式确认 seamMode。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track, source, videoModel, aspectRatio, deliveryMode, targetDurationSeconds, styleBase, styleCardId, confirmedLocks]
              properties:
                track: { type: string, enum: [domestic, overseas, explainer, other] }
                source: { type: string, enum: [original, adaptation, benchmark, trend] }
                videoModel: { type: string, enum: [seedance-2.5, seedance-2.0, minimax-h3] }
                aspectRatio: { type: string, enum: ["16:9", "9:16", "21:9"] }
                deliveryMode: { type: string, enum: [board, markdown, both] }
                seamMode: { type: string, enum: [tail-frame-freeze, hard-cut, insert-shot, creative-transition] }
                targetDurationSeconds: { type: integer, minimum: 1 }
                styleBase: { type: string, enum: [live-action, 2d-animation, 3d-cg, ink-2d] }
                styleCardId: { type: string }
                assetMode: { type: string, enum: [M0, M1, M2] }
                confirmedLocks:
                  type: array
                  minItems: 6
                  uniqueItems: true
                  description: 单段任务至少确认六项；多段任务还需 seamMode
                  items:
                    type: string
                    enum: [track, source, videoModel, aspectRatio, deliveryMode, styleCard, seamMode]
      responses:
        "200":
          description: 信封 data.item 为新锁回执，含 revision、segmentCount 与 SHA-256 contentHash
        "400":
          description: 字段无效、硬锁未逐项确认，或目标时长需要多段但缺少 seamMode
        "403":
          description: 当前成员角色不能修改 P0
  /manju/projects/{projectId}/deliverables:
    get:
      tags: [manju]
      summary: 读取项目内所有生产链版本的持久化交付文件
      description: |
        只返回 P5 事务中持久化的 ManjuDeliverable 行，不从工件临时拼造文件。
        V2 markdown 行集含 markdown、previs、manifest；board/both 另含 board。
        接口保留所有生产链的历史行，不因新版本生成而隐藏旧交付。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: |
            信封 data.items 为不可变交付行，含 productionRunId、kind、fileName、mimeType、
            contentHash、contentContractVersion 和 complianceStatus。
            kind 为 markdown、board、previs 或 manifest；V1 历史行集为 LEGACY_COMPLIANT。
        "404":
          description: 项目不存在、不是漫剧项目或当前账号无权访问
  /manju/projects/{projectId}/production-runs/{runId}/deliverables:
    get:
      tags: [manju]
      summary: 读取指定生产链版本的持久化交付文件
      description: |
        按 productionRunId 返回该版本自己的 Markdown、看板、P4.5 和交付清单。
        P5 历史版本切换使用此接口，不改变当前 P0 revision，也不读取其他生产链的行。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.items 为该生产链的不可变交付行
        "404":
          description: 项目、生产链不存在或当前账号无权访问
  /manju/projects/{projectId}/script-runs:
    post:
      tags: [manju]
      summary: 创建 V7.4.26 P1 剧本运行
      description: |
        P0 必须已锁定。素材来源只允许 original、adaptation、benchmark、trend。
        polish 不是第五个来源：adaptation 且 inputKind=finished_script 时进入润色分支。
        source=trend 时必须显式选择 trendResolution=original|benchmark。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [STEPWISE, FULL_SCRIPT_PIPELINE] }
                inputKind: { type: string, enum: [novel, outline, finished_script] }
                trendResolution: { type: string, enum: [original, benchmark] }
                title: { type: string }
                sourceDocumentId: { type: string }
                chapterIds:
                  type: array
                  items: { type: string }
                baseRunId: { type: string }
                reuseGlobalStages: { type: boolean }
      responses:
        "200":
          description: 信封 data.item 为带 branch、inputKind、trendResolution 和六阶段状态的运行详情
        "400":
          description: P0 未锁、来源/输入类型无效，或 trend 未选择解析路线
        "403":
          description: 当前成员角色不能创建 P1
  /manju/projects/{projectId}/script-runs/{runId}/stages/roundtable_review/decide:
    post:
      tags: [manju]
      summary: 提交五席圆桌用户决策
      description: |
        这是 roundtable_review 的唯一锁定入口。审核必须处于 AWAITING_USER_DECISION。
        普通 confirm、manual-correct 和 regenerate-artifact 在该状态均返回 409。
        PROCEED_CURRENT 锁定当前审核；B/NOT_READY 接受当前稿必须 acceptQualityRisk=true。
        REFINE_OR_REWRITE 将本轮审核标为 STALE，并重新打开 script_draft 的下一版本。
        每次有效决策都追加不可变台账，记录审核工件 ID、哈希、等级和风险确认。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum: [PROCEED_CURRENT, REFINE_OR_REWRITE]
                acceptQualityRisk:
                  type: boolean
                  default: false
                note:
                  type: string
      responses:
        "200":
          description: 信封 data.item 为更新后的运行详情，含 roundtableDecisions 和下游阶段状态
        "400":
          description: decision 缺失或非法；B/NOT_READY 接受当前稿未确认质量风险
        "403":
          description: 当前成员角色不能提交决策
        "404":
          description: 项目、运行或圆桌阶段不存在
        "409":
          description: 审核不在 AWAITING_USER_DECISION、等级缺失/冲突/不支持，或尝试使用旁路接口
  /manju/projects/{projectId}/models:
    put:
      tags: [manju]
      summary: 保存项目级文本、图片、视频模型路由
      description: 仅主理人或制片可写。每个槽位必须引用画布后台已启用且 capability 匹配的系统渠道模型；不支持音频槽位。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, image, video]
              properties:
                text: { $ref: "#/components/schemas/ManjuModelSelection" }
                image: { $ref: "#/components/schemas/ManjuModelSelection" }
                video: { $ref: "#/components/schemas/ManjuModelSelection" }
      responses:
        "200":
          description: 信封 data.item 为已保存的模型路由
        "400":
          description: 槽位缺失、模型停用或能力不匹配
        "403":
          description: 当前成员角色不能修改模型路由
  /manju/projects/{projectId}/members:
    post:
      tags: [manju]
      summary: 邀请已有活动账号加入漫剧项目或更新其角色
      description: 仅主理人可写。用户身份来自托管 session；请求体只接受 userId 和项目角色。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string }
                role: { type: string, enum: [producer, writer, director, reviewer, viewer] }
      responses:
        "200":
          description: 信封 data.item 为成员记录；重复邀请同一账号会更新原记录
        "400":
          description: 用户 ID、角色或活动账号无效
        "403":
          description: 只有主理人可以管理成员
  /manju/projects/{projectId}/members/{memberId}:
    delete:
      tags: [manju]
      summary: 从漫剧项目移除协作者
      description: 仅主理人可写。项目归属人不能作为成员行移除。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.deleted 为 true
        "404":
          description: 项目或成员不存在
  /manju/projects/{projectId}/asset-runs/{runId}/regenerate:
    post:
      tags: [manju]
      summary: 重新生成 P2 数字资产任务
      description: |
        仅主理人、制片或导演可写。旧 P2 任务、工件和参考图保留；新任务从实体提取开始。
        请求体省略 reuseAssets 时默认为 true，使用当前已完成同模式资产库作为基线。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instruction: { type: string }
                reuseAssets: { type: boolean, default: true }
      responses:
        "200":
          description: 信封 data.item 为已启动的新 P2 详情
        "400":
          description: 旧任务、素材形态或资产复用条件无效
        "403":
          description: 当前成员角色不能重新生成 P2
        "404":
          description: 项目或 P2 任务不存在
        "409":
          description: 当前 P2 任务尚未完成或不满足复用门禁
  /manju/projects/{projectId}/production-runs/{runId}/stages/{stageKey}/regenerate:
    post:
      tags: [manju]
      summary: 重新生成 P3 或 P4 生产阶段
      description: |
        仅允许 director_storyboard（P3）和 feed_package（P4）。旧生产链标记 SUPERSEDED 并完整保留。
        P3 新版本从 P3 开始；P4 新版本复制已锁定的 P3 工件和 READY 故事板图引用，并从 P4 开始。
        阶段或媒体任务仍在 queued/running 时拒绝创建新版本。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: stageKey
          required: true
          schema: { type: string, enum: [director_storyboard, feed_package] }
      responses:
        "200":
          description: 信封 data.item 为从目标阶段开始的新生产链详情
        "403":
          description: 当前成员角色不能重新生成生产阶段
        "404":
          description: 项目、生产链或阶段不存在
        "409":
          description: 目标阶段未锁定或仍等待确认、上游 P3 未锁定，或仍有任务在运行
  /manju/projects/{projectId}/production-runs:
    post:
      tags: [manju]
      summary: 创建 V7.4.26 P3-P5 生产链
      description: |
        需要已完成并锁定的 P2。新链固定创建四个阶段：
        decision_anchor（P0B）→ director_storyboard（P3）→ feed_package（P4）→ qc_handoff（P5）。
        P0B 未锁时 P3 不得运行。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetRunId]
              properties:
                assetRunId: { type: string }
      responses:
        "200":
          description: 信封 data.item 为生产链详情，stages 顺序固定并以 P0B 为首
        "400":
          description: 当前 P2 或已有活动生产链状态不允许创建
        "403":
          description: 当前成员角色不能创建生产链
        "409":
          description: P2 尚未完成并锁定
    get:
      tags: [manju]
      summary: 列出生产链版本
      description: 返回当前版本及保留的历史版本，不下发删除或改写历史工件的操作。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.items 为生产链摘要，含 status、currentStage 与 lockRevision
        "404":
          description: 项目不存在或当前账号无权访问
  /manju/projects/{projectId}/production-runs/{runId}:
    get:
      tags: [manju]
      summary: 读取生产链详情
      description: |
        返回四个生产阶段、已持久化工件、P4.5 状态、故事板图片和视频任务。
        P4 machineCheckStatus=PASS 只在该凭证完整且绑定当前锁定 P3 工件时出现；
        缺失、残缺或错绑的凭证显示 LEGACY_NON_COMPLIANT。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.item 为生产链详情
        "404":
          description: 项目、生产链不存在或当前账号无权访问
  /manju/projects/{projectId}/production-runs/{runId}/stages/{stageKey}/run:
    post:
      tags: [manju]
      summary: 执行当前生产阶段
      description: |
        严格 JSON 只接受 instruction。skipValidation、未知字段和尾随 JSON 返回 400。
        阶段只能按 P0B → P3 → P4 → P5 顺序执行，上游未锁定时返回 409。
        P4 固定运行 compile_feed.py → validate_prompt.py → gate_check.py → script_feed_diff.py。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: stageKey
          required: true
          schema: { type: string, enum: [decision_anchor, director_storyboard, feed_package, qc_handoff] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instruction: { type: string }
      responses:
        "200":
          description: 信封 data.item 为已启动或推进后的生产链详情
        "400":
          description: 阶段参数无效、含 skipValidation/未知字段，或 JSON 后还有尾随值
        "403":
          description: 当前成员角色不能执行生产阶段
        "404":
          description: 生产链或阶段不存在
        "409":
          description: 上游阶段未锁定、当前阶段不满足启动条件，或机器门禁失败
  /manju/projects/{projectId}/production-runs/{runId}/stages/{stageKey}/confirm:
    post:
      tags: [manju]
      summary: 确认并锁定生产阶段
      description: |
        P0B 必须满足情绪锚点表和构图雷区 A/B 合同。
        P3 必须有完整表演/导演/分镜/图形化交付，并且每个必出故事板段取得真实图片资源。
        P4 必须有完整四段机检凭证且绑定当前锁定 P3；P4.5 未通过 check_p45.py 时仍不可锁定。
        P5 在同一事务中持久化 C 交付文件并完成生产链。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: stageKey
          required: true
          schema: { type: string, enum: [decision_anchor, director_storyboard, feed_package, qc_handoff] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: 信封 data.item 为锁定后的生产链详情
        "403":
          description: 当前成员角色不能确认生产阶段
        "404":
          description: 生产链或阶段不存在
        "409":
          description: 阶段未待确认、上游未锁、P3 故事板未齐、P4/P4.5 机检无效或视频未就绪
  /manju/projects/{projectId}/production-runs/{runId}/previs-storyboard:
    post:
      tags: [manju]
      summary: 生成独立 P4.5 预演故事板附件
      description: |
        从已锁定 P3 与当前 P4 投喂稿创建文本任务。结果必须是独立 Markdown，
        不生成图片、不进入视频投喂稿；check_p45.py 失败时保留失败状态且 P4 不能锁定。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.item 为带 P4.5 任务状态的生产链详情
        "403":
          description: 当前成员角色不能生成 P4.5
        "404":
          description: 生产链不存在
        "409":
          description: P3/P4 状态不允许生成，或已有 P4.5 任务在运行
  /manju/projects/{projectId}/production-runs/{runId}/storyboard-images:
    post:
      tags: [manju]
      summary: 启动逐段 P3 故事板图片任务
      description: |
        解析锁定 P3 故事板表并创建所需图片任务。每个必出段都必须取得真实资源；
        部分成功、任务运行中或资源失效时 P3 保持 AWAITING_CONFIRMATION。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.item 为含逐段图片状态的生产链详情
        "400":
          description: P3 故事板表无法解析为逐段图片任务
        "403":
          description: 当前成员角色不能启动 P3 图片
        "409":
          description: P0B/P3 状态不满足，或图片任务已经运行
  /manju/projects/{projectId}/production-runs/{runId}/videos:
    post:
      tags: [manju]
      summary: 启动逐段 P4 视频任务
      description: |
        从锁定 P3 和当前 P4 投喂稿创建逐段视频任务。所有段必须取得真实视频资源，
        P4.5 也必须通过；两者任一未满足时 P4 不能锁定。
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.item 为含逐段视频状态的生产链详情
        "400":
          description: P4 投喂稿无法解析为逐段视频任务
        "403":
          description: 当前成员角色不能启动 P4 视频
        "409":
          description: P3/P4 状态不允许，或只有失败段可以重试
  /business/tools:
    get:
      tags: [agent-ops]
      summary: Discover mounted business tools available to external clients
      description: |
        A registered external client uses X-Beeftv-Client and its Bearer token.
        The response lists mounted business handlers and their method, path, query,
        body schemas, readOnly flag, and generation cost hints. External clients
        manage execution approval. Identity, ownership, balance, validation and
        revision checks still run in the existing handlers. Legacy read-only
        credentials cannot execute writes. A listed handler may return
        FeatureUnavailable when its feature is disabled.
      parameters:
        - in: header
          name: X-Beeftv-Client
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          description: Bearer registered-client token
          schema: { type: string }
      responses:
        "200":
          description: Envelope data contains tools, readOnly, authentication and approval
        "403":
          description: Invalid client, forbidden origin or unavailable local identity
  /projects/{id}/chapter-apply-receipts:
    get:
      tags: [projects]
      summary: 查询章节生成结果的持久化写入回执
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: taskIds
          description: 逗号分隔的生成任务 ID，最多 100 个
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.receipts 含 taskId、op、kind、applied；只返回本项目已提交回执
        "404":
          description: 项目不存在或不属于当前用户
        "500":
          description: 回执无法读取，不推断结果已应用
  /creation-conversations:
    get:
      tags: [creation-conversations]
      summary: 列出当前工作区未删除的创作对话
      description: 返回已提交对话文档与墓碑 ID。IndexedDB 不是提交事实。
      responses:
        "200":
          description: 信封 data 为 conversations 与 deletedIds
  /creation-conversations/import:
    post:
      tags: [creation-conversations]
      summary: 按稳定操作标识导入本地历史对话
      description: 仅在没有后端记录或墓碑时导入；同一 operationId 与哈希可重放。
      responses:
        "200":
          description: 信封 data 含 imported 与对话记录
        "409":
          description: 同一操作标识对应不同内容
  /creation-conversations/{id}:
    get:
      tags: [creation-conversations]
      summary: 读取一条未删除的创作对话
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 为 revision 与 document
        "404":
          description: 不存在或已删除
    put:
      tags: [creation-conversations]
      summary: 按 expectedRevision 提交一条创作对话
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 新 revision
        "409":
          description: 版本冲突或墓碑拒绝复活
    delete:
      tags: [creation-conversations]
      summary: 为创作对话写入墓碑
      description: 不删除关联任务或素材。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: expectedRevision
          schema: { type: integer }
      responses:
        "200":
          description: 墓碑已写入
  /beefapi/connection:
    get:
      tags: [beefapi]
      summary: 读取内置 BeefAPI 连接状态
      description: 只返回账号和状态，不含密钥或 device_code。
      responses:
        "200":
          description: 信封 data 为连接摘要
  /beefapi/connection/start:
    post:
      tags: [beefapi]
      summary: 开始企业授权并打开系统浏览器确认页
      responses:
        "200":
          description: 进入 pending 或返回已连接状态
  /beefapi/connection/models:
    post:
      tags: [beefapi]
      summary: 使用当前企业连接刷新并保存模型目录
      description: 不接受客户端密钥或价格；读取上游目录并保存可信能力和报价。连接改变或读取失败时返回错误。
      responses:
        "200":
          description: 信封 data.models 为已保存的上游目录项
  /beefapi/connection/cancel:
    post:
      tags: [beefapi]
      summary: 取消尚未完成的授权
      responses:
        "200":
          description: 当前连接摘要
  /beefapi/connection/disconnect:
    post:
      tags: [beefapi]
      summary: 断开当前连接并吊销本机这把密钥
      responses:
        "200":
          description: 当前连接摘要
  /beefapi/connection/open-wallet:
    post:
      tags: [beefapi]
      summary: 在系统浏览器打开企业充值页 /console/topup
      responses:
        "200":
          description: 已打开
  /canvas-folders:
    get:
      tags: [canvas]
      summary: 列出当前用户的画布文件夹
      responses:
        "200":
          description: 信封 data.folders 为文件夹列表，封面为资源 ID
  /canvas-folders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      tags: [canvas]
      summary: 创建或更新画布文件夹
      description: 已删除的文件夹 ID 不能重新导入。封面必须是当前用户已就绪的资源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                folder:
                  type: object
                  required: [name]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    coverResourceId: { type: string }
      responses:
        "200":
          description: 信封 data.folder 为保存后的文件夹
        "400":
          description: 名称、ID 或封面资源不合法
        "409":
          description: 文件夹已删除，不能用原 ID 重建；本地草稿由前端保留并决定恢复方式
    delete:
      tags: [canvas]
      summary: 删除画布文件夹并清空画布归属
      description: 删除会递增仍指向该文件夹的画布 revision，并更新画布正文中的 folderId。重复删除已删除的文件夹返回成功。
      responses:
        "200":
          description: 信封 data.id 为已删除的文件夹
        "404":
          description: 文件夹不存在或不属于当前用户
  /canvas-projects/{id}/drawings:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 列出画布下的画板摘要（不含快照正文）
      responses:
        "200":
          description: 信封 data.drawings 为画板摘要
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/drawings/{drawingId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: drawingId
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取画板快照与 revision
      responses:
        "200":
          description: 信封 data.drawing 含 snapshot、revision 与预览/成品资源 ID
        "404":
          description: 画布或画板不存在
    put:
      tags: [canvas]
      summary: 按 revision 保存画板快照
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。丢失应答后用同一请求重试会回放已提交结果。已删除的画板不能用原 ID 重新导入；前端应保留可恢复草稿并决定恢复方式，不得自动按原 ID 写回。请求体上限为账号画布和素材数据上限加 JSON 信封余量，写入按同一上限核算字节，没有单独的 8MB 画板上限。预览和成品必须是当前用户已就绪的资源 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drawing]
              properties:
                drawing:
                  type: object
                  required: [revision]
                  properties:
                    drawingId: { type: string }
                    engine: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                    snapshot: { type: object }
                    previewResourceId: { type: string }
                    render:
                      type: object
                      properties:
                        resourceId: { type: string }
      responses:
        "200":
          description: 信封 data.drawing 返回递增后的 revision
        "400":
          description: 画板、引擎或资源引用不合法，或 JSON 无法解析
        "403":
          description: 账号画布和素材数据已达上限
        "409":
          description: 版本冲突，或画板已删除不能用原 ID 重新导入；reason 为 conflict 表示 CAS，failed_precondition 表示已删除。已删除时前端保留可恢复草稿，不自动按原 ID 写回
        "428":
          description: 缺少 revision
    delete:
      tags: [canvas]
      summary: 删除画板快照
      description: 删除写入墓碑并释放预览/成品资源引用。重复删除已删除的画板返回成功。
      responses:
        "200":
          description: 信封 data.id 为已删除的画板
        "404":
          description: 画布或画板不存在
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "404":
          description: 画布不存在或不属于当前用户
    put:
      tags: [canvas]
      summary: 按 revision 保存画布内容
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。忽略客户端 viewport 和 remoteContentHash，updatedAt 由服务端生成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  required: [id, revision]
                  properties:
                    id: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                  additionalProperties: true
      responses:
        "200":
          description: 信封 data.project 返回摘要及递增后的 revision
        "400":
          description: 请求、版本或素材引用不合法
        "409":
          description: 版本或资源状态冲突，原内容未被覆盖；保留草稿后加载最新版
        "428":
          description: 缺少 revision，需刷新客户端并重新读取
  /canvas-projects/{id}/history:
    get:
      tags: [canvas]
      summary: 读取当前画布版本与最近 20 份历史摘要
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 currentRevision 和 snapshots；每项含 id、revision、title、nodeCount、connectionCount、payloadBytes、reason、contentUpdatedAt、createdAt，不含正文
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/history/{snapshotId}:
    get:
      tags: [canvas]
      summary: 按需读取历史正文
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 snapshot 摘要和 project 正文
        "404":
          description: 画布或快照不存在、已过期或无权访问
  /canvas-projects/{id}/history/{snapshotId}/restore:
    post:
      tags: [canvas]
      summary: 备份当前内容并将历史内容恢复为新版本
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 信封 data.project 返回恢复后的摘要及新 revision；当前 ID、归属与项目关联保留
        "404":
          description: 画布或快照不存在、已过期或无权访问
        "409":
          description: 当前版本或素材状态已变化，恢复未执行
        "428":
          description: 缺少当前 revision
  /ops:
    get:
      tags: [agent-ops]
      summary: 列出调用者身份可用的操作描述（含 JSON Schema）
      description: |
        能力模式只由调用者身份决定：已登记客户端的模式来自服务端登记，请求体或查询参数都不能提升权限。
        只读客户端只会拿到 readOnly 操作；写操作在 /ops/{op} 上仍按登记权限强制拒绝。
      responses:
        "200":
          description: 信封 data.ops 为操作描述数组，data.readOnly 表示本次调用的能力模式
        "403":
          description: 非本机同源，或身份不足（缺少已登记客户端凭据与 owner 凭据）
  /ops/{op}:
    post:
      tags: [agent-ops]
      summary: 执行单个操作（CLI、MCP 与内置 pi 会话共用）
      description: |
        写操作必须提供 opId 作为幂等键：同一 opId 同参数回读原结果，不同参数返回冲突。
        写操作还必须在 params 里带上读取时的 expectedRevision：缺少或已过期都会被拒绝，
        不会覆盖别人刚写入的内容。字段落点由画布能力描述符声明（例如生成类节点的可编辑
        提示词落在 metadata.composerContent），操作层不自行拼文档形状。
      parameters:
        - name: op
          in: path
          required: true
          schema:
            type: string
          description: 操作 ID，例如 canvas.get、canvas.nodes.create、canvas.node.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opId:
                  type: string
                  description: 写操作的幂等键；只读操作不接受该字段
                params:
                  type: object
                  description: 操作参数，形状以 GET /ops 返回的 JSON Schema 为准
      responses:
        "200":
          description: 信封 data 为操作结果；data.replayed=true 表示命中了幂等回放
        "400":
          description: 参数错误；reason=unsupported_field 表示该节点类型没有这个可编辑字段（整批不写）
        "409":
          description: 同一 opId 用于不同请求内容，或 revision 已过期（reason=stale_revision）
        "412":
          description: 缺少读取时的 expectedRevision
        "403":
          description: 只读客户端尝试写操作（reason=read_only_client），或身份不足
  /assistant/status:
    get:
      tags: [assistant]
      security: []
      summary: 内置创作助手宿主状态（免身份、不含凭据）
      responses:
        "200":
          description: 信封 data 为 { available, reason?, url?, health? }；未就绪时给出明确原因
  /assistant/ui-session:
    post:
      tags: [assistant]
      summary: 签发短期限 UI 会话凭据
      description: 需本机同源，并出示 owner 凭据（或本机显式的开发引导开关）。
      responses:
        "200":
          description: 信封 data.token 为绑定当前 owner 的短期限凭据，data.expiresAt 为到期时间；只应保存在内存里并在到期前续签
        "403":
          description: 非本机同源，或既没有 owner 凭据也没有显式本地引导
  /assistant/chat:
    post:
      tags: [assistant]
      summary: 流式对话（NDJSON）
      description: |
        请求头 X-Beeftv-Ui-Session 由 /assistant/ui-session 签发。响应为 NDJSON：
        若干 text_delta 增量，最后恰好一条 turn_end 结算（含 reply、toolCalls、error、cancelled）。
        宿主凭据与模型密钥由后端注入，浏览器不接触。
        X-Beeftv-Turn-Admission 响应头为 rejected（尚未尝试创建业务轮次）、unknown（已尝试创建）或 admitted（已创建）。
        只有 rejected 可以确认未接纳；缺少标记、网络故障或接纳后失败仍需读取回执。续签凭据不会重放消息。
      responses:
        "200":
          description: application/x-ndjson 事件流
        "403":
          description: 缺少或过期的 UI 会话凭据
        "503":
          description: 宿主未配置或不可达（reason=host_token_missing / host_unreachable）
  /assistant/cancel:
    post:
      tags: [assistant]
      summary: 取消指定画布正在进行的回合
      description: 需要写权限，并且 canvasId 必须属于当前工作区。只读客户端不能取消。
      responses:
        "202":
          description: 已受理取消
        "403":
          description: 只读客户端，或缺少写权限
        "404":
          description: 画布不存在或不属于当前工作区，或该画布没有正在进行的会话
  /assistant/host/config:
    get:
      tags: [assistant]
      summary: 读取宿主配置（需 owner 凭据 + 本机同源）
      responses:
        "200":
          description: 信封 data 为 { config, configured, supervisorRunning }
        "403":
          description: 缺少 owner 凭据
    put:
      tags: [assistant]
      summary: 写入宿主配置（当前文本模型与宿主启动命令）
      description: 只写入本机配置文件；启动命令永远不来自请求体。
      responses:
        "200":
          description: 信封 data.config 为写入后的配置
        "403":
          description: 缺少 owner 凭据
  /assistant/host/start:
    post:
      tags: [assistant]
      summary: 启动内置宿主（需 owner 凭据 + 本机同源）
      responses:
        "200":
          description: 信封 data.pid 为本进程启动的宿主进程号
        "503":
          description: 未配置启动命令（reason=host_command_missing）或启动失败
  /assistant/host/stop:
    post:
      tags: [assistant]
      summary: 停止本进程启动的内置宿主
      description: 只停止本进程启动过的子进程；应用关闭时会自动执行同样的清理。
      responses:
        "200":
          description: 信封 data.stopped=true
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /admin/channels/{id}/duplicate:
    post:
      tags: [admin]
      summary: 复制系统渠道
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      tags: [auth]
      summary: 当前登录会话
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录并设置会话 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /projects:
    get:
      tags: [projects]
      summary: 短剧项目列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [projects]
      summary: 创建短剧项目
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /resources:
    get:
      tags: [resources]
      summary: 当前用户资源列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/{id}/playback:
    post:
      tags: [resources]
      summary: 按需准备当前用户视频预览
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /resources/playback-cache:
    delete:
      tags: [resources]
      summary: 清理当前用户已完成的视频预览缓存
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 读取资源二进制（非 JSON 信封）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文件流
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /timeline/render-plan:
    post:
      tags: [tasks]
      summary: 编译时间线语义渲染计划
      description: |
        只读规划：根据时间线快照与不透明源元数据返回版本化语义计划。
        不排队、不落盘、不计费，不接受 ffmpeg 参数或本地路径。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /timeline/renders:
    post:
      tags: [tasks]
      summary: 创建本机时间线渲染任务
      description: 接收时间线快照与输出选项（宽高、帧率、采样率、是否烧录字幕）。选项写入任务输入，由本机 ffmpeg 按语义计划执行。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /timeline/transcriptions:
    post:
      tags: [tasks]
      summary: 创建本机字幕转写任务
      description: 接收待转写素材编号和可选语言。只接受当前用户已上传完成的音视频。省略 model 使用本地 whisper.cpp，指定 model 使用已连接 BeefTV 账号目录中的 audio.transcriptions 模型，音轨提取后最多 25 MiB。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /depth-captures:
    post:
      tags: [tasks]
      summary: 创建本机深度动作捕捉任务
      description: 接收待处理视频素材编号。只接受当前用户已上传完成的视频。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      tags: [tasks]
      summary: 创建生成任务
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks/{id}:
    get:
      tags: [tasks]
      summary: 任务详情
      description: 生成结果正在取回时，data.delivery.outputs[] 给出每个输出的 downloadedBytes、totalBytes（未知为 -1）、bytesPerSecond 和 state（downloading / retrying / waiting）。waiting 表示服务端明确回复文件尚未就绪，retrying 表示下载出错后等待重试。字节数仅计入成功响应的文件内容。这是进程内存里的实时进度，不写数据库，取回结束即消失。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "404":
          description: 任务不存在或无权访问
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/{id}:
    delete:
      tags: [assets]
      summary: 删除无业务引用的素材
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: expectedStatus
          schema: { type: string, enum: [archived] }
          description: 清空回收站时传 archived；事务内核对状态，已还原的素材返回 409 并保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          description: 无效的状态条件
        "409":
          description: 素材状态已变化或仍有业务引用，未删除
components:
  parameters:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    ManjuModelSelection:
      type: object
      required: [channelId, modelKey]
      properties:
        channelId: { type: string }
        modelKey: { type: string }
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504, 40301, 40901, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - failed_precondition
                - quota_exceeded
                - rate_limited
                - unavailable
                - timeout
                - internal
                - local_storage_failed
                - local_credential_failed
                - local_disk_full
                - bad_gateway
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
  responses:
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
